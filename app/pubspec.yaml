name: panelsolar
description: "Panelsolar: análisis y diseño de instalaciones fotovoltaicas para instaladores."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  crypto: ^3.0.8
  data_sources:
    path: ../packages/data_sources
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.3.3
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_timezone: ^5.1.1
  geo_kit:
    path: ../packages/geo_kit
  geolocator: ^14.1.2
  go_router: ^18.1.4
  image: ^4.12.0
  image_picker: ^1.2.4
  intl: any
  open_filex: ^5.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  persistence:
    path: ../packages/persistence
  regional_packs:
    path: ../packages/regional_packs
  solar_engine:
    path: ../packages/solar_engine
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
